<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#265bed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ことばノート"><title>ことばノート — 話して、すっきり。</title><meta name="description" content="今日のやること、買い物、メモ、予定をひとつに。ことばノートの操作できる試作です。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23265bed'/%3E%3Cpath d='M18 21h28v19H32l-9 8v-8h-5z' fill='white'/%3E%3C/svg%3E"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=18"></head>
<body><div id="app"></div><dialog id="capture"><form method="dialog" class="dialog-close"><button aria-label="閉じる" class="icon-btn">×</button></form><div class="dialog-body"><span class="eyebrow" id="capture-eyebrow">QUICK CAPTURE</span><h2 id="capture-title">思いついたことを、そのまま。</h2><p class="muted" id="capture-lead">話しても、文字で入力しても大丈夫。</p><button type="button" id="record" class="record-btn" aria-label="音声入力を開始・停止"></button><p id="speech-status" class="speech-status" aria-live="polite">マイクを押して話す</p><p class="small muted">音声認識は端末・ブラウザのサービスを使用します。<br>マイクの許可を毎回聞かれるときは <button type="button" id="voice-mode-link" class="text-btn inline-link">キーボードの音声入力に切り替える</button></p><label for="capture-text" class="field-label">話した内容・入力した内容</label><textarea id="capture-text" rows="4" placeholder="例：今日中に資料を確認。牛乳とパンを買う。"></textarea><button type="button" id="keyboard-input" class="text-btn keyboard-input">キーボードの音声入力を使う</button><div class="capture-actions"><button type="button" id="try-sample" class="text-btn">サンプルで試す</button><button type="button" id="organize" class="primary">整理する <span aria-hidden="true">→</span></button></div><p class="small muted">試作ではキーワードで振り分けます。内容を確認・修正して追加してください。</p><div id="candidates"></div></div></dialog><dialog id="detail"><form method="dialog" class="dialog-close"><button aria-label="閉じる" class="icon-btn">×</button></form><div id="detail-body" class="dialog-body"></div></dialog><input type="file" id="restore-file" accept="application/json,.json" hidden><div id="toast" role="status" aria-live="polite"></div><script src="app.js?v=18"></script></body></html>
